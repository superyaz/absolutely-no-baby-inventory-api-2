name: CI/CD Pipeline - Absolutely No Baby Inventory

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-typecheck:
    name: Lint & Type Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Code Analysis
        run: npm run lint

      - name: Dependency Security Audit
        run: npm audit --audit-level=high

  test-and-build:
    name: Test & Build Production Bundle
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Vite Production Build
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-app
          path: dist/
          retention-days: 7

  deploy-cloud-run:
    name: Continuous Deployment to Google Cloud Run
    runs-on: ubuntu-latest
    needs: test-and-build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: 'read'
      id-token: 'write'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Authorize Docker Push to Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker Container
        run: |
          docker build -t us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/anb-registry/inventory-app:${{ github.sha }} .
          docker push us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/anb-registry/inventory-app:${{ github.sha }}

      - name: Deploy to Cloud Run (Zero Downtime)
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: anb-inventory-service
          region: us-central1
          image: us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/anb-registry/inventory-app:${{ github.sha }}
          flags: '--port=3000 --min-instances=1 --max-instances=10 --cpu=1 --memory=512Mi --allow-unauthenticated'

      - name: Healthcheck Verification
        run: |
          URL=$(gcloud run services describe anb-inventory-service --platform managed --region us-central1 --format 'value(status.url)')
          curl -f "$URL/healthz" || exit 1
